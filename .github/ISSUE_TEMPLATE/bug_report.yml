name: バグ報告
description: 想定どおりに動作しない問題を報告する
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        ご報告ありがとうございます。調査に必要な情報をご記入ください。

        - 「(必須)」と書かれた項目は、可能な限りご記入ください。
        - 認証情報・個人情報・非公開の内部情報は記載しないでください。

  - type: textarea
    id: summary
    attributes:
      label: 概要 (必須)
      description: 何が起きているかを1〜3文で説明してください。
      placeholder: 例) 特定の操作を行うと処理が完了せずエラーになる。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順 (必須)
      description: 第三者が同じ状態を再現できる粒度で、番号付きで記載してください。
      placeholder: |
        1. ...を開く
        2. ...を入力する
        3. ...を実行する
        4. エラーが表示される
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する挙動 (必須)
      description: 本来どうなるべきだと考えているかを記載してください。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の挙動 (必須)
      description: 実際に何が起きたかを記載してください。エラーメッセージやログがあれば引用してください。
      placeholder: |
        実際の結果:

        エラーメッセージ / ログ:
        ```
        ここに貼り付け
        ```
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 環境情報 (必須)
      description: 事象を確認した環境を記載してください。分かる範囲で構いません。
      value: |
        - 対象のバージョン / コミット:
        - OS とそのバージョン:
        - 実行環境 (ランタイム / ブラウザ等) とそのバージョン:
        - インストール方法:
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 再現頻度
      description: どの程度の頻度で発生しますか。
      options:
        - 毎回発生する
        - ときどき発生する
        - 一度だけ発生した
        - 不明
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 追加情報
      description: スクリーンショット、関連する Issue や Pull Request、回避策など、参考になる情報があれば記載してください。
    validations:
      required: false
